<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absen NTP - Biometric Attendance</title>
    <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
    <div class="absen-ntp-container kiosk-container">
        <!-- Area Header -->
        <header class="app-header">
            <div class="logo-area">
                <span class="status-dot"></span>
                <div>
                    <h1>ABSEN NTP</h1>
                    <span class="subtitle">AUTOMATED BIOMETRIC ATTENDANCE SYSTEM</span>
                </div>
            </div>

            <div class="header-right">
                <div class="datetime-badge">
                    <span id="liveDate">-- --- ----</span>
                    <span class="separator">|</span>
                    <span id="liveTime">--:--:--</span>
                </div>
            </div>
        </header>

        <!-- Tata Letak Utama -->
        <main class="main-grid">
            <!-- Panel Kiri: Layar Kamera Webcam -->
            <section class="card camera-section">
                <div class="card-header">
                    <div class="section-title">
                        <span class="title-icon">📷</span>
                        <h2 id="cameraTitle">CAMERA PREVIEW</h2>
                    </div>
                    <span class="badge" id="cameraStatus">STANDBY</span>
                </div>
                
                <div class="camera-viewport">
                    <!-- Siaran Live Stream Kamera Logitech C930e (V4L2) -->
                    <img id="streamVideo" class="camera-stream" src="api/camera/stream" alt="Live Camera Preview">
                    <video id="webcamVideo" class="hidden" autoplay playsinline muted></video>

                    <!-- Overlay Saat Standby / Terjadi Kendala -->
                    <div class="camera-overlay hidden" id="cameraOverlay">
                        <div class="camera-icon" id="cameraIcon">📷</div>
                        <p id="cameraMessage">Menghubungkan kamera...</p>
                        <button id="retryCameraBtn" class="absen-ntp-retry-btn kiosk-retry-btn hidden" type="button">🔄 Hubungkan Ulang Kamera</button>
                    </div>

                    <!-- Panduan Oval Wajah Biometrik -->
                    <div class="face-guide-overlay" id="faceGuide">
                        <div class="face-oval"></div>
                        <div class="face-guide-text">POSISIKAN WAJAH DI DALAM AREA INI</div>
                    </div>

                    <!-- Tampilan Hitung Mundur -->
                    <div class="countdown-overlay hidden" id="countdownOverlay">
                        <span id="countdownNumber">3</span>
                    </div>

                    <!-- Pratinjau Foto Hasil Jepretan -->
                    <img id="capturedPreview" class="captured-preview hidden" alt="Captured Frame">
                    
                    <!-- Efek Lampu Kilat Rana -->
                    <div id="captureFlash" class="capture-flash"></div>
                    
                    <!-- Kanvas Snapshot (Offscreen) -->
                    <canvas id="captureCanvas" class="hidden"></canvas>
                </div>
            </section>

            <!-- Panel Kanan: Informasi Karyawan & Status Presensi -->
            <section class="card info-section">
                <div class="card-header">
                    <div class="section-title">
                        <span class="title-icon">👤</span>
                        <h2>EMPLOYEE INFORMATION</h2>
                    </div>
                </div>
                
                <div class="info-content">
                    <div class="info-group">
                        <label>Nama Karyawan</label>
                        <div class="info-value" id="employeeName">-</div>
                    </div>

                    <div class="info-group">
                        <label>Nomor Induk Karyawan (NIK)</label>
                        <div class="info-value highlight" id="employeeNik">-</div>
                    </div>

                    <div class="info-group">
                        <label>Tipe Presensi (In / Out)</label>
                        <div class="info-value" id="attendanceType" style="font-weight: 800; letter-spacing: 1px;">-</div>
                    </div>

                    <!-- NIK Manual Input & Tombol Masuk/Keluar -->
                    <div class="input-container info-group">
                        <label for="rfidInput">MASUKKAN NIK</label>
                        <div class="input-wrapper">
                            <span class="input-icon">🔢</span>
                            <input type="text" id="rfidInput" class="absen-ntp-input kiosk-input" placeholder="Masukkan NIK" inputmode="numeric" pattern="[0-9]*" autocomplete="off" autofocus>
                        </div>
                        <div class="manual-btn-group">
                            <button type="button" id="btnManualMasuk" class="manual-action-btn btn-masuk" title="Tekan Enter atau klik untuk Presensi Masuk">
                                🟢 MASUK (Enter)
                            </button>
                            <button type="button" id="btnManualKeluar" class="manual-action-btn btn-keluar" title="Tekan tombol + atau klik untuk Presensi Keluar">
                                🔴 KELUAR (+)
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <span>&bull; Masukkan NIK atau Tempel RFID [Enter = MASUK, + = KELUAR] &bull; Kamera V4L2 Aktif &bull;</span>
        </footer>
    </div>

    <script src="app.js?v=31"></script>
</body>
</html>
